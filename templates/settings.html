{% extends 'base.html' %}

{% block title %}设置 - 清晨点支烟{% endblock %}

{% block head %}
<style>
.settings-page {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem;
    min-height: calc(100vh - 180px);
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.page-header {
    text-align: center;
    margin-bottom: 3rem;
}

.page-header h1 {
    font-family: var(--font-body);
    font-size: 2rem;
    font-weight: 700;
    color: var(--color-text-primary);
}

.page-header p {
    color: var(--color-text-muted);
    font-size: 0.95rem;
    margin-top: 0.5rem;
}

.settings-options {
    display: flex;
    gap: 2rem;
    justify-content: center;
    flex-wrap: wrap;
}

.settings-card {
    background: var(--color-bg-card);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-lg);
    padding: 2rem;
    width: 280px;
    text-align: center;
    cursor: pointer;
    transition: all var(--transition-medium);
    display: block;
    text-decoration: none;
}

.settings-card:hover {
    border-color: var(--color-accent);
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
}

.settings-card-icon {
    width: 60px;
    height: 60px;
    background: var(--color-accent-subtle);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
}

.settings-card-icon svg {
    width: 30px;
    height: 30px;
    fill: var(--color-accent);
}

.settings-card-title {
    font-family: var(--font-body);
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--color-text-primary);
    margin-bottom: 0.5rem;
}

.settings-card-desc {
    color: var(--color-text-muted);
    font-size: 0.85rem;
    line-height: 1.5;
}

.settings-note {
    text-align: center;
    margin-top: 2rem;
    color: var(--color-text-muted);
    font-size: 0.8rem;
}
</style>
{% endblock %}

{% block content %}
<div class="settings-page">
    <header class="page-header">
        <h1>设置</h1>
        <p>选择要配置的功能</p>
    </header>

    <div class="settings-options">
        <a href="/settings/nav" class="settings-card">
            <div class="settings-card-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 3h7v7H3V3m11 0h7v7h-7V3m-11 11h7v7H3v-7m11 0h7v7h-7v-7M5 5v3h3V5H5m11 0v3h3V5h-3M5 16v3h3v-3H5m11 0v3h3v-3h-3z"/>
                </svg>
            </div>
            <h3 class="settings-card-title">导航设置</h3>
            <p class="settings-card-desc">自定义导航卡片顺序、添加/删除分类和链接</p>
        </a>

        <a href="/settings/password" class="settings-card">
            <div class="settings-card-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 1C9.243 1 7 3.243 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-1V6c0-2.757-2.243-5-5-5zM9 6c0-1.654 1.346-3 3-3s3 1.346 3 3v2H9V6zm9 4v10H6V10h12zm-6 2a2 2 0 0 0-1 3.732V18h2v-2.268A2 2 0 0 0 12 12z"/>
                </svg>
            </div>
            <h3 class="settings-card-title">密码设置</h3>
            <p class="settings-card-desc">设置网页登录密码、滑动解锁密码、博客管理密码</p>
        </a>
    </div>

    <p class="settings-note">需要登录验证后才能修改设置</p>
</div>
{% endblock %}
