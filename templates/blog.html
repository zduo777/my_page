{% extends 'base.html' %}

{% block title %}Blog - 清晨点支烟{% endblock %}

{% block head %}
<style>
.blog-page {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 2rem;
}

.page-header {
    text-align: center;
    margin-bottom: 3rem;
}

.page-header h1 {
    font-family: var(--font-body);
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    font-weight: 700;
    color: var(--color-text-primary);
    letter-spacing: 0.02em;
    margin-bottom: 0.5rem;
}

.page-subtitle {
    color: var(--color-text-muted);
    font-size: 0.95rem;
    letter-spacing: 0.05em;
}

.article-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.article-card {
    display: block;
    background: var(--color-bg-card);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-md);
    padding: 1.5rem 2rem;
    transition: all var(--transition-medium);
    position: relative;
    overflow: hidden;
}

.article-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 3px;
    background: var(--color-accent);
    transform: scaleY(0);
    transition: transform var(--transition-medium);
}

.article-card:hover {
    background: var(--color-bg-card-hover);
    border-color: var(--color-border);
    transform: translateX(4px);
    box-shadow: var(--shadow-md);
}

.article-card:hover::before {
    transform: scaleY(1);
}

.card-title {
    font-family: var(--font-body);
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--color-text-primary);
    margin-bottom: 0.5rem;
    transition: color var(--transition-fast);
}

.article-card:hover .card-title {
    color: var(--color-accent);
}

.card-meta {
    display: flex;
    align-items: center;
    gap: 1rem;
    color: var(--color-text-muted);
    font-size: 0.85rem;
}

.card-date::before {
    content: '';
    width: 4px;
    height: 4px;
    background: var(--color-accent);
    border-radius: 50%;
    display: inline-block;
    margin-right: 0.5rem;
}
</style>
{% endblock %}

{% block content %}
<div class="blog-page">
    <header class="page-header">
        <h1>Blog</h1>
        <p class="page-subtitle">记录编程心得与技术探索</p>
    </header>

    <div class="article-list">
        {% for post in posts %}
        <a href="{{ url_for('post', slug=post.slug) }}" class="article-card">
            <h2 class="card-title">{{ post.title }}</h2>
            <div class="card-meta">
                <span class="card-date">{{ post.created_at }}</span>
            </div>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
