{% extends 'base.html' %}

{% block title %}{{ title }} - MyBlog{% endblock %}

{% block content %}
<article>
    <header class="post-header">
        <h1 class="post-title">{{ title }}</h1>
        <div class="post-meta">
            <span class="post-date">发表于 {{ created_at }}</span>
        </div>
    </header>

    <div class="post-content">
        {{ content|safe }}
    </div>

    <a href="/" class="back-btn">返回列表</a>
</article>
{% endblock %}
