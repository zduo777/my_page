<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="个人技术博客 - 分享编程心得与技术探索">
    <title>{% block title %}清晨点支烟{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    {% block head %}{% endblock %}
<style>
/* 全局设置按钮触发区域 */
.global-settings-trigger {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 80px;
    height: 80px;
    z-index: 100;
}

.global-settings-btn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--color-bg-tertiary);
    border: 1px solid var(--color-border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: all var(--transition-medium);
    z-index: 99;
}

.global-settings-trigger:hover .global-settings-btn {
    opacity: 1;
}

.global-settings-btn:hover {
    background: var(--color-bg-card-hover);
    border-color: var(--color-accent);
}

.global-settings-btn svg {
    width: 20px;
    height: 20px;
    fill: var(--color-text-secondary);
    transition: fill var(--transition-fast);
}

.global-settings-btn:hover svg {
    fill: var(--color-accent);
}

@media (max-width: 768px) {
    .global-settings-trigger,
    .global-settings-btn {
        display: none;
    }
}
</style>
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="header-left">
            <a class="header-logo" href="/">清晨点支烟</a>
            <nav class="header-nav">
                <a class="nav-link" href="/nav">Nav</a>
                <a class="nav-link" href="/blog">Blog</a>
            </nav>
        </div>
        <button class="menu-toggle" id="menuToggle" aria-label="打开菜单">
            <span class="menu-icon">
                <span class="menu-line"></span>
                <span class="menu-line"></span>
                <span class="menu-line"></span>
            </span>
            <span class="menu-text">MENU</span>
        </button>
    </header>

    <!-- Fullscreen Menu -->
    <div class="fullscreen-menu" id="fullscreenMenu">
        <div class="menu-content">
            <nav class="menu-nav">
                <a class="menu-link" href="/">Home</a>
                <a class="menu-link" href="/nav">Nav</a>
                <a class="menu-link" href="/blog">Blog</a>
            </nav>
            <div class="menu-footer">
                <p class="menu-copyright">© 2026 清晨点支烟</p>
            </div>
        </div>
        <button class="menu-close" id="menuClose" aria-label="关闭菜单">
            <span class="close-icon">×</span>
        </button>
    </div>

    <main class="content-wrapper">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 清晨点支烟 · 以文字记录思考</p>
        <a href="https://beian.miit.gov.cn/" target="_blank">湘ICP备2026019595号</a>
    </footer>

    <!-- 全局设置按钮 -->
    <div class="global-settings-trigger">
        <button class="global-settings-btn" id="globalSettingsBtn" aria-label="打开设置">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5a3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97c0-.33-.03-.66-.07-1l2.26-1.77c.2-.16.25-.46.12-.7l-2-3.46c-.13-.24-.43-.32-.66-.2l-2.6 1.1a7.4 7.4 0 0 0-1.55-.85l-.4-2.76c-.03-.26-.26-.46-.53-.46h-4c-.27 0-.5.2-.53.46l-.4 2.76c-.56.22-1.08.51-1.55.85l-2.6-1.1c-.23-.12-.53-.04-.66.2l-2 3.46c-.13.24-.08.54.12.7L4.57 11c-.04.34-.07.67-.07 1c0 .33.03.65.07.97l-2.26 1.77c-.2.16-.25.46-.12.7l2 3.46c.13.24.43.32.66.2l2.6-1.1c.47.34.99.63 1.55.85l.4 2.76c.03.26.26.46.53.46h4c.27 0 .5-.2.53-.46l.4-2.76c.56-.22 1.08-.51 1.55-.85l2.6 1.1c.23.12.53.04.66-.2l2-3.46c.13-.24.08-.54-.12-.7l-2.26-1.77Z"/>
            </svg>
        </button>
    </div>

    <script>
    document.getElementById('menuToggle').addEventListener('click', function() {
        document.getElementById('fullscreenMenu').classList.add('active');
        document.body.style.overflow = 'hidden';
    });

    document.getElementById('menuClose').addEventListener('click', function() {
        document.getElementById('fullscreenMenu').classList.remove('active');
        document.body.style.overflow = '';
    });

    document.getElementById('fullscreenMenu').addEventListener('click', function(e) {
        if (e.target === this) {
            this.classList.remove('active');
            document.body.style.overflow = '';
        }
    });

    // 全局设置按钮
    document.getElementById('globalSettingsBtn').addEventListener('click', function() {
        window.location.href = '/settings';
    });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
